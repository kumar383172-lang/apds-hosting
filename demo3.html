<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
        }
        .img{
            background-image: url('bg.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            height:auto;
          

            
        
        }
        
        
  
        .login{ margin-top: 50px;
            display: flex;
        
            justify-content: center;
            align-items: center;
            height: auto;
            flex-wrap: wrap;
        }
        .form{
            
            background-color: rgba(255, 255, 255, 0.3);
            padding: 40px;
            display: flex;
            gap: 30px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 420px;
            border-radius: 30px;
            display: none;
        }
        .loginform{
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin: 30px ;
            padding: 10px;
        }
        .loginform input{
            padding: 20px;
            border-radius: 25px;
            border: 1px solid #1B4332;
            font-size: 20px;
            background-color: rgba(255, 255, 255, 0);
            transition: transform 0.3s ease;
        }
            .loginform input:focus{
                transform: scale(1.08);
                border-color: #1B4332;
                outline-color: red;
                outline-width: 2px;
                
                
            }
        .loginbtn{
            padding: 15px;
            border-radius: 35px;
            border: none;
            background-color: #1B4332;
            color: rgb(255, 246, 246);
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.5s;
        }
        .loginbtn:hover{
            transform: scale(1.08);
            font-size: 22px;
        }
        .form-header h1{
            color: #1B4332;
            font-size: 50px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            
          
        }
        .account h2{
            color: #1B4332;
            font-size: 30px;
           
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-align: center;
        }
        
        .remember label{
            color: #ffffff;
            font-size: 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #remember h3 a{
            font-weight: bold;
            font-size: 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration: none;
            color: #ff0000;
            
        }
        #remember   label{
            font-weight: bold;
            font-size: 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1B4332;
        }
        .remember{border: 2px solid #1B4332;
                width:15px;
                height: 15px;
            cursor: pointer;
        }
        #remember{
            display: flex;
            gap: 9px;
            
            justify-content: space-between;
            align-items: center;
        }
        .checkbox-container{
            display: flex;
            align-items: center; 
            gap:5px;
        }
        #reg{
            
            font-weight: bold;
            font-size: 22px;
            margin-top: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1B4332;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s;
            
        }
        #reg:hover{
            transform: scale(1.08);
            color: #1f4e2f;
        } 
        #reg a{
            text-decoration: none;
            color: #1B4332;
        }
        
       
        .register{
            background-color: rgba(255, 255, 255, 0.3);
            padding: 40px;
            display: flex;
            gap: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 420px;
            border-radius: 30px;
            
            
        }

        
        .register h1{
            color: #1B4332;
            font-size: 50px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            
        }
        register h2{
            color: #1B4332;
            font-size: 30px;
           
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-align: center;
        }
        .registerform{
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin: 30px ;
        
        }
        .registerform input{
            padding: 17px;
            border-radius: 25px;
            border: 1px solid #1B4332;
            font-size: 20px;
            background-color: rgba(255, 255, 255, 0);
            transition: transform 0.3s ease;
        }
        .registerform input:focus{
            transform: scale(1.08);
            border-color: #1B4332;
            outline-color: rgb(255, 140, 0);
            outline-width: 2px;
            
            
        }
        .registerbtn{
            padding: 11px;
            border-radius: 35px;
            border: none;
            background-color: #1B4332;
            color: rgb(255, 246, 246);
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.5s;
        }
        .registerbtn:hover{
            transform: scale(1.08);
            font-size: 22px;
        }
        .backtologin{
            font-weight: bold;
            font-size: 22px;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1B4332;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s;
        }
        .backtologin a{
            text-decoration: none;
            color: #1B4332;
            transition: transform 0.3s;
        }
       .backtologin:hover{
            transform: scale(1.08);
            color: #1f4e2f;
        
        }
        .backtologin a:hover{
            transform: scale(1.09);
            font-size: 28px;
            color: #064025;
        }
    </style>
</head>
<body class="img">
   
    <section class="login">
        <div class="form">

            <div class="form-header">
                <h1>Login</h1>
            </div>
            <div class="account">
                <h2>Have an account?</h2></div>
            <form class="loginform">
                <input type="text" placeholder="Username" name="username" required>
                <input type="password" placeholder="Password" name="password" required>
                <button class="loginbtn" type="submit">SIGN IN</button>
                <div id="remember">
                    <div class="checkbox-container">
                        <input type="checkbox" class="remember" name="remember" id="remember">
                        <label for="remember"> Remember me</label>
                    </div>
                    <h3><a href="#">Forgot Password?</a></h3>
                </div>
                <div id="reg"><a href="demo3.html">REGISTER</a></div>
            </form>
        </div>
        <div class="register">
            <h1>Register</h1>
            <h2>Don't have an account?</h2>
            <form class="registerform">
                <input type="text" placeholder="ID" name="id" required>
                <input type="text" placeholder="Username" name="username" required>
                <input type="email" placeholder="Email" name="email" required>
                <input type="tel" pattern="[0-9]{10}"placeholder="Phone Number" name="mobile" required>
                <input type="password" placeholder="Password" name="password" required>
                <button class="registerbtn" type="submit">REGISTER</button>
            </form>
            <div class="backtologin"><a href="demo2.html">GO TO LOGIN</a></div>
        </div>

    </section>
<script>
    async function loadUsers() {
        const response = await fetch("users.json");
        if (!response.ok) {
            alert("Error loading user database");
            return [];
        }
        return await response.json();
    }

    // Login verification
    document.querySelector(".loginform").addEventListener("submit", async function(event) {
        event.preventDefault();
        const username = event.target.username.value.trim();
        const password = event.target.password.value.trim();

        const users = await loadUsers();
        const user = users.find(u => u.username === username && u.password === password);

        if (user) {
            alert("✅ Login successful! Welcome " + user.username);
            window.location.href = "admin.html";
        } else {
            alert("❌ Invalid username or password.");
        }
    });

    // Registration (adds new user in memory only)
    document.querySelector(".registerform").addEventListener("submit", async function(event) {
        event.preventDefault();
        const newUser = {
            id: event.target.id.value.trim(),
            username: event.target.username.value.trim(),
            email: event.target.email.value.trim(),
            mobile: event.target.mobile.value.trim(),
            password: event.target.password.value.trim()
        };

        const users = await loadUsers();
        users.push(newUser);

        alert("✅ Registration successful! You can now log in.");
        document.querySelector(".register").style.display = "none";
        document.querySelector(".form").style.display = "flex";
    });

    // Toggle register form
    document.querySelector("#reg a").addEventListener("click", function(e) {
        e.preventDefault();
        document.querySelector(".form").style.display = "none";
        document.querySelector(".register").style.display = "flex";
    });
</script>


</body>
</html>
